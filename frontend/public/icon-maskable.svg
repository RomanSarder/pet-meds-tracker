<!--
  Maskable variant of icon.svg: full-bleed terracotta field (the OS applies
  its own mask shape, e.g. a circle, so no baked-in corner rounding here)
  with the paw mark scaled down to sit inside the ~80% safe zone maskable
  icons require. Same colours and glyph as icon.svg — see that file's
  header for provenance.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pet Meds">
  <rect x="0" y="0" width="512" height="512" fill="#C25A3C" />
  <g transform="translate(256,256) scale(7.5) translate(-12,-12)" fill="none" stroke="#F6F3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="4" r="2" />
    <circle cx="18" cy="8" r="2" />
    <circle cx="20" cy="16" r="2" />
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
  </g>
</svg>
