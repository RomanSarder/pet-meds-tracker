<!--
  Pet Meds app icon — rounded-square terracotta field with the app's paw
  mark (lucide "paw-print", the same glyph used by the pets tab in
  frontend/src/components/ds/pets/TabBar.tsx). Colours are the design
  system's own tokens (frontend/src/components/ds/tokens/colors.css):
  --accent (#C25A3C) for the field, --ink-inverse (#F6F3EC) for the mark.
  Not a new logo — a direct restatement of the existing mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Pet Meds">
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#C25A3C" />
  <g transform="translate(256,256) scale(11) translate(-12,-12)" fill="none" stroke="#F6F3EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="4" r="2" />
    <circle cx="18" cy="8" r="2" />
    <circle cx="20" cy="16" r="2" />
    <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
  </g>
</svg>
