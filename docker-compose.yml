services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pet
      POSTGRES_PASSWORD: pet
      POSTGRES_DB: pet_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pet -d pet_tracker"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
